name: Build camera recognition APK

on:
  push:
    branches:
      - feat/camera-scale-recognition
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: android_app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: android_app/**/*.gradle*

      - name: Test camera digit candidate detector
        run: ./gradlew :app:testDebugUnitTest --tests "com.health.openscale.ui.screen.camera.ScaleDisplayRecognizerTest" --no-daemon --stacktrace

      - name: Print unit test reports on failure
        if: failure()
        run: |
          for report in app/build/test-results/testDebugUnitTest/*.xml; do
            [ -f "$report" ] && cat "$report"
          done

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: camera-recognition-test-results
          path: android_app/app/build/test-results/testDebugUnitTest/*.xml
          if-no-files-found: ignore

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: openScale-camera-recognition-debug
          path: android_app/app/build/outputs/apk/**/*.apk
